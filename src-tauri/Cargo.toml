[package]
name = "karban"
version = "1.0.1"
description = "Karban – hospodský roguelike se žolíky (desktopová aplikace)"
authors = ["radecek147 and Karban contributors"]
license = "MIT"
repository = "https://github.com/radecek147/FM"
edition = "2021"
rust-version = "1.77"

[lib]
# Jméno knihovny se liší od binárky, aby se na Windows nepletly výstupy (doporučení Tauri).
name = "karban_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# Menší a rychlejší release (hra je přibalená jako statické soubory, nativní kód je jen obal).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
