<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Ikona desktopové aplikace (vlastní kresba, licence projektu) ve stylu „Sirkárna“: tmavě modrý karton
       s tiskovým rastrem a karta s korunou jako favicon hry — plné tiskové barvy, silná linka, tvrdý stín
       a lehký nesoutisk. Zaoblený čtverec 824 × 824 s okrajem 100 px odpovídá mřížce ikon macOS.
       PNG/ICNS: npm run desktop:icon -->
  <defs>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="17" r="5" fill="#f3e8cf" opacity="0.09" />
    </pattern>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="186" />
    </clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="#1f2e4a" />
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#dots)" />
    <!-- Hořčicový pruh přes roh jako na zápalkové nálepce. -->
    <path d="M100 760 L760 100 L924 100 L924 160 L160 924 L100 924 Z" fill="#e9b030" opacity="0.92" />
    <path d="M100 760 L760 100 M160 924 L924 160" stroke="#1a1714" stroke-width="14" fill="none" />
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#1a1714" stroke-width="22" />
  <g transform="translate(512 520) rotate(-8) translate(-210 -290)">
    <!-- Tvrdý stín karty (bez rozmazání). -->
    <rect x="34" y="38" width="420" height="580" rx="48" fill="#0d1526" />
    <rect x="0" y="0" width="420" height="580" rx="48" fill="#f3e8cf" stroke="#1a1714" stroke-width="20" />
    <!-- Koruna: hořčicový podtisk posunutý proti rumělce (nesoutisk). -->
    <path d="M92 432 128 226 210 324 292 226 328 432Z" fill="#e9b030" transform="translate(12 10)" />
    <path d="M92 432 128 226 210 324 292 226 328 432Z" fill="#d7442c" stroke="#1a1714" stroke-width="18" stroke-linejoin="round" />
    <circle cx="128" cy="200" r="36" fill="#e9b030" stroke="#1a1714" stroke-width="14" />
    <circle cx="292" cy="200" r="36" fill="#e9b030" stroke="#1a1714" stroke-width="14" />
    <circle cx="210" cy="296" r="36" fill="#e9b030" stroke="#1a1714" stroke-width="14" />
    <rect x="86" y="432" width="248" height="64" rx="12" fill="#22365c" stroke="#1a1714" stroke-width="16" />
  </g>
</svg>
