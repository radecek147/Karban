name: Desktop (macOS, Windows, Linux)

# Desktopová aplikace (Tauri, docs/ARCHITECTURE.md „Desktopová aplikace“) pro tři systémy:
# - macOS: univerzální .dmg (Apple Silicon i Intel), podepsané jen ad hoc,
# - Windows: instalátor .exe (NSIS, 64bit), nepodepsaný,
# - Linux: .AppImage (spustitelné bez instalace) a .deb (Ubuntu / Debian).
# Ručně (Actions → Desktop → Run workflow): balíčky ke stažení v artefaktech běhu (ZIP, jen po přihlášení).
# S volbou „nightly“ se navíc zveřejní jako testovací verze (pre-release `nightly`, přepisuje se) — soubory
# mají přímé odkazy, např. releases/download/nightly/Karban_<verze>_x64-setup.exe.
# Po zveřejnění release na GitHubu se balíčky navíc přiloží k release.
# Bez podpisových certifikátů systémy aplikaci při prvním spuštění neověří (postup v README „Desktopová verze“).

on:
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Zveřejnit jako testovací verzi (pre-release „nightly“ s přímými odkazy ke stažení)'
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Testovací verze: release `nightly` se pokaždé smaže a založí znovu na tomhle commitu (stejný štítek a stejná
  # jména souborů = odkazy ke stažení se nemění). Balíčky do něj nahrají joby `build`.
  nightly:
    name: Testovací verze (nightly)
    if: github.event_name == 'workflow_dispatch' && inputs.nightly
    runs-on: ubuntu-latest
    steps:
      - name: Recreate the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly --target "$GITHUB_SHA" --prerelease --title "Testovací verze" \
            --notes "Automatický build z větve ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::7}). Instalátory nejsou podepsané — postup prvního spuštění je v README v části Desktopová verze."

  build:
    name: ${{ matrix.name }}
    needs: nightly
    # Bez testovací verze je job `nightly` přeskočený — build běží i tak (jen ne po jeho selhání).
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (.dmg)
            os: macos-latest
            artifact: Karban-macOS
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            upload: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows (.exe)
            os: windows-latest
            artifact: Karban-Windows
            rust-targets: ''
            args: --bundles nsis
            files: src-tauri/target/release/bundle/nsis/*.exe
            upload: src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux (.AppImage, .deb)
            os: ubuntu-22.04
            artifact: Karban-Linux
            rust-targets: ''
            args: --bundles appimage,deb
            # `files` pro příkazy shellu (mezery), `upload` pro upload-artifact (řádky).
            files: src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb
            upload: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.artifact }}

      - name: Linux system libraries (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      # Unit testy stačí na jednom systému (celou sadu pouští i CI při každém pushi).
      - name: Unit tests
        if: runner.os == 'Linux'
        run: npm test

      - name: Build app
        run: npx tauri build ${{ matrix.args }}

      - name: Check the macOS bundle
        if: runner.os == 'macOS'
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Karban.app"
          for bin in "$APP"/Contents/MacOS/*; do lipo -info "$bin"; done
          codesign --verify --deep --verbose=2 "$APP"

      - name: List packages
        shell: bash
        run: ls -la ${{ matrix.files }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.upload }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach packages to the nightly pre-release
        if: github.event_name == 'workflow_dispatch' && inputs.nightly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload nightly ${{ matrix.files }} --clobber

      - name: Attach packages to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ${{ matrix.files }} --clobber
